name: Preview release notes
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Public source repository
        default: hwameistor/hwameistor-operator
        required: true
        type: string
      target_branch:
        description: Branch containing the selected changes
        default: release/v1.1
        required: true
        type: string
      version:
        description: Version label for this preview
        default: v1.1.2-alpha1
        required: true
        type: string
      from_tag_choice:
        description: Automatic starting tag when from_tag is empty (highest SemVer first)
        default: latest
        type: choice
        options:
          - latest
          - second-latest
          - third-latest
      from_tag:
        description: Optional manual starting tag; overrides automatic selection
        required: false
        type: string
      to_ref:
        description: Ending ref (inclusive); empty uses target branch
        type: string
      model:
        description: Copilot model enabled for your account
        required: true
        default: gpt-6.1-sol
        type: choice
        options:
          - gpt-6.1-sol
          - gpt-6-astra
          - gemini-4-argon
          - gpt-5.3-codex
          - gemini-3.8-flash
      changelog_policy:
        description: 'Advanced (optional): policy path or public HTTPS file URL; empty uses defaults'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts && npm run build
      - name: Restore frozen range
        id: range-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .release-assistant-output/snapshot.json
          key: release-preview-range-${{ github.run_id }}
      - name: Require the original range on rerun
        if: github.run_attempt > 1 && steps.range-cache.outputs.cache-hit != 'true'
        run: |
          echo 'The frozen preview range is unavailable. Start a new preview; refusing to advance the range during a rerun.' >&2
          exit 1
      - name: Generate read-only Copilot preview
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          RA_REPOSITORY: ${{ inputs.repository }}
          RA_TARGET_BRANCH: ${{ inputs.target_branch }}
          RA_VERSION: ${{ inputs.version }}
          RA_FROM_TAG: ${{ inputs.from_tag }}
          RA_FROM_TAG_CHOICE: ${{ inputs.from_tag_choice }}
          RA_TO_REF: ${{ inputs.to_ref }}
          RA_MODEL: ${{ inputs.model }}
          RA_CHANGELOG_POLICY: ${{ inputs.changelog_policy }}
        run: node scripts/preview.mjs
      - name: Preserve range even when inference fails
        if: always() && steps.range-cache.outputs.cache-hit != 'true' && hashFiles('.release-assistant-output/snapshot.json') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .release-assistant-output/snapshot.json
          key: release-preview-range-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-assistant-output/
          include-hidden-files: true
          if-no-files-found: ignore
